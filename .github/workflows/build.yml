name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        run: unzip -o source.zip -d src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build
        working-directory: src
        run: gradle assembleRelease bundleRelease --no-daemon

      - name: Rename
        run: |
          cp src/app/build/outputs/apk/release/app-release.apk Salati.apk
          cp src/app/build/outputs/bundle/release/app-release.aab Salati.aab

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: صلاتي ${{ github.run_number }}
          files: |
            Salati.apk
            Salati.aab
          make_latest: true
